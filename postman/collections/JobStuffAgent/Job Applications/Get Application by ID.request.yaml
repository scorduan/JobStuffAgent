$kind: http-request
method: GET
url: '{{baseUrl}}/applications/{{applicationId}}'
order: 3000
description: |-
  Retrieve a single job application by its UUID.

  Returns `200 OK` with the `JobApplicationResponse` body, or `404 Not Found` if the id does not exist.
  Accessible to both `APPLICATIONS_READ_ONLY` and `APPLICATIONS_MANAGER` roles.
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response body contains expected fields", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("company");
          pm.expect(json).to.have.property("role");
          pm.expect(json).to.have.property("status");
          pm.expect(json).to.have.property("createdAt");
          pm.expect(json).to.have.property("updatedAt");
      });

      pm.test("Returned id matches requested id", function () {
          const json = pm.response.json();
          pm.expect(json.id).to.eql(pm.collectionVariables.get("applicationId"));
      });
