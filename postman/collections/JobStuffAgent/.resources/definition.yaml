$kind: collection
name: JobStuffAgent API
description: |-
  REST API for the JobStuffAgent application — a job-application lifecycle tracker.

  **Authentication:** HTTP Basic. Two roles are supported:
  - `APPLICATIONS_READ_ONLY` — may call GET endpoints on `/applications/**`
  - `APPLICATIONS_MANAGER` — may call all methods on `/applications/**` and `/workflows/**`

  Set the `basicUsername` and `basicPassword` collection variables (or override them in an environment) before running requests.
variables:
  baseUrl: http://localhost:8080
  basicUsername: manager
  basicPassword: ""
  applicationId: ""
auth:
  type: basic
  credentials:
    username: "{{basicUsername}}"
    password: "{{basicPassword}}"
